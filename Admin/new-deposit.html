<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./supplier-credit.css" />
  </head>
  <body>
    <div class="card">
      <h4>New Deposit</h4>
      <div class="form">
        <form action="">
          <div class="row">
            <div class="col">
              <label for="name" class="form-label">Customer Name</label>
              <input
                type="text"
                class="form-control"
                placeholder="First name"
                aria-label="First name"
              />
            </div>
            <div class="col">
              <label for="phone" class="form-label">Customer Phone</label>
              <input
                type="tel"
                class="form-control"
                placeholder="phone"
                aria-label="phone"
              />
            </div>
          </div>
          <div class="mb-3">
            <label for="pName" class="form-label">Product Name</label>
            <input type="text" class="form-control" id="pName" />
          </div>
          <div class="row">
            <div class="col">
              <label for="Tprice" class="form-label">Total Price</label>
              <input
                type="number"
                class="form-control"
                placeholder="Tprice"
                aria-label="Tprice"
              />
            </div>
            <div class="col">
              <label for="Dprice" class="form-label">Deposit Price</label>
              <input
                type="number"
                class="form-control"
                placeholder="Dprice"
                aria-label="Dprice"
              />
            </div>
          </div>
          <div class="row">
            <div class="col">
              <label for="Ddate" class="form-label">Deposit Date</label>
              <input
                type="date"
                class="form-control"
                placeholder="Ddate"
                aria-label="Ddate"
              />
            </div>
            <div class="col">
              <label for="Expected completion" class="form-label"
                >Expected completion</label
              >
              <input
                type="date"
                class="form-control"
                placeholder="Expected completion"
                aria-label="Expected completion"
              />
            </div>
          </div>
          <div class="select">
            <label for="status">Status</label>
            <select class="form-select" aria-label="Default select example">
              <option selected>Open this select menu</option>
              <option value="1">Active</option>
              <option value="2">Complete</option>
              <option value="3">Cancelled</option>
            </select>
          </div>
          <div class="text">
            <label for="notes">Notes</label>
            <textarea
              class="form-control"
              placeholder="Leave a comment here"
              id="floatingTextarea"
            ></textarea>
          </div>
          <div class="button1">
            <button type="button" class="btn btn-primary btn-sm">
              cancel
            </button>
            <button type="button" class="btn btn-secondary btn-sm">
             Register scheme
            </button>
          </div>
        </form>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
