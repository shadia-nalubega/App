<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./credit.css" />
  </head>
  <body>
    <div class="container">
      <form>
        <h2>NyondoStock Hardware</h2>
        <h3>Credit Payment Form</h3>
        <div class="mb-3">
          <label for="saleRep" class="form-label">Supplier name</label>
          <input type="text" class="form-control" id="salesRep" />
        </div>
<label for="product">Product Name</label>
        <select class="form-select" aria-label="Default select example">
          <option selected>Choose Item</option>
          <option value="1">Cement</option>
          <option value="2">Nails</option>
          <option value="3">Iron-sheets</option>
          <option value="3">Guages</option>
          <option value="3">Paint</option>
          <option value="3">Steel Bars</option>
        </select>
       
        <div class="customer">
          <div class="col-md-6">
            <label for="inputTotal Credit Payment Date4" class="form-label">Total Credit Payment Date</label>
            <input type="Total Credit Payment Date" class="form-control" id="inputTotal Credit Amount4" />
          </div>
          <!-- <div class="col-md-6">
            <label for="phone" class="form-label">Phone</label>
            <input type="tel" class="form-control" id="phone" />
          </div> -->
        </div>

        
        <!-- <input class="btn btn-primary" type="" value=""> -->

        <div class="item">
          <div class="customer">
            <div class="col-md-6">
              <label for="quantity" class="form-label"> Amount Paid</label>
              <input type="number" class="form-control" id-unique="quantity" />
            </div>
            
          </div>
          <div class="customer">
            <div class="col-md-6">
              <label for="amount" class="form-label">Payment Date</label>
              <input type="number" class="form-control" id-unique="Payment Date" />
            </div>
            <div class="col-md-6">
              <label for="saleDate" class="form-label">Payment Method </label>
              <select>
                  <option value="select customer type">select Unit</option>
                  <option value="potential Customer">Grams</option>
                  <option value="Real customers">litres</option>
                  <option value="Real customers">tonnes</option>
                  <option value="Real customers">cans</option>
                </select>
            </div>
          </div>
        </div>
        
        <div class="dates">
          <div class="col-md-6">
            <label for="saleDate" class="form-label"> Balance Remaining</label>
            <input type="date" class="form-control" id-unique="phone" />
          </div>
          
        </div>
        <div class="note">
            <label for="comments">Comments</label><br>
            <textarea name="comment" id=""></textarea>
        </div>
        <button type="button" class="btn btn-md text-white bg-dark button mt-3">
         Back
        </button>
        <button
          type="button"
          class="btn btn-md text-white bg-dark button mt-3 float"
        >
         Save Payment
        </button>
      </form>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
