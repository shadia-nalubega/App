<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./sales-reg.css" />
  </head>
  <body>
    <div class="container">
      <form>
        <h2>NyondoStock Hardware</h2>
        <h3>Sales Form</h3>
        <div class="mb-3">
          <label for="saleRep" class="form-label">Sales Representative</label>
          <input type="text" class="form-control" id="salesRep" />
        </div>
        <h4>Customer information</h4>
        <div class="mb-3">
          <label for="customerName" class="form-label">Customer Name</label>
          <input type="text" class="form-control" id="customerName" />
        </div>
        <div class="customer">
          <div class="col-md-6">
            <label for="inputEmail4" class="form-label">Email</label>
            <input type="email" class="form-control" id="inputEmail4" />
          </div>
          <div class="col-md-6">
            <label for="phone" class="form-label">Phone</label>
            <input type="tel" class="form-control" id="phone" />
          </div>
        </div>

        <h4>Item</h4>

        <label for="product">Product</label>
        <select class="form-select" aria-label="Default select example">
          <option selected>Choose Item</option>
          <option value="1">Cement</option>
          <option value="2">Nails</option>
          <option value="3">Iron-sheets</option>
          <option value="3">Guages</option>
          <option value="3">Paint</option>
          <option value="3">Steel Bars</option>
        </select>
        <!-- <input class="btn btn-primary" type="" value=""> -->

        <div class="item">
          <div class="customer">
            <div class="col-md-6">
              <label for="quantity" class="form-label"> Quantity</label>
              <input type="number" class="form-control" id-unique="quantity" />
            </div>
            <div class="col-md-6">
              <label for="unitPrice" class="form-label">Unit Price</label>
              <input type="number" class="form-control" id-unique="unitPrice" />
            </div>
          </div>
          <div class="customer">
            <div class="col-md-6">
              <label for="amount" class="form-label">Amount</label>
              <input type="number" class="form-control" id-unique="amount" />
            </div>
            <div class="col-md-6">
              <label for="saleDate" class="form-label">Sale Date</label>
              <input type="date" class="form-control" id-unique="phone" />
            </div>
          </div>
        </div>
        <button type="button" class="btn btn-primary btn-sm mt-2 float mb-3">
          Add item
        </button>
        <div class="mt-4">
        <label for="payment">Payment Method</label>
        <select class="form-select" aria-label="Default select example">
          <option selected>Choose payment method</option>
          <option value="1">Cash</option>
          <option value="2">Mobile Money</option>
          <option value="3">Card Payment</option>
          <option value="4">Bank Transfer</option>
        </select>
        </div>
        <button type="button" class="btn btn-md text-white bg-dark button mt-3">
          Register Sale
        </button>
        <button type="button" class="btn btn-md text-white bg-dark button mt-3 float">
          cancel
        </button>
      </form>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
