<html lang="en">

    <meta charset="utf-8" />

      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./view.css" />
  </head>
  <body>
    <div class="cards">
      <div class="container">
        <div class="grid">
          <h3>NYONDOSTOCK</h3>
          <h4 style="text-align: center">stock view</h4>

          <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
              
              <form class="d-flex" role="search">
                <input
                  class="form-control me-2"
                  type="search"
                  placeholder="Search items"
                  aria-label="Search"
                />
                <button class="btn btn-outline-success" type="submit">
                  Search
                </button>
              </form>
            </div>
          </nav>
          <div>
            <h5>Item:</h5>
          </div>
          <div class="d-flex card1">
            <div class="card col-4">
              <div class="card-header">Opening stock</div>
              <div class="card-body">
                <h5 class="card-title"></h5>
                <p class="card-text">running low</p>
              </div>
            </div>
            <div class="card col-4">
              <div class="card-header">current Stock</div>
              <div class="card-body">
                <h5 class="card-title"></h5>
                <p class="card-text">in stock</p>
              </div>
            </div>
            <div class="card col-4">
              <div class="card-header">closing Stock</div>
              <div class="card-body">
                <h5 class="card-title">000</h5>
                <p class="card-text">no stock</p>
              </div>
            </div>
          </div>
          <div class="part d-flex">
            <div class="card col-4">
              <div class="card-header">last restock</div>
              <div class="card-body">
                <h5 class="card-title">000</h5>
                <p class="card-text">no stock</p>
              </div>
            </div>
            <div class="card col-4">
              <div class="card-header">last sale</div>
              <div class="card-body">
                <h5 class="card-title">000</h5>
                <p class="card-text">no stock</p>
              </div>
            </div>
           
          </div>
 <div class="remarks">
              <p>Remarks:low on stock</p>
            </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"

    ></script>
