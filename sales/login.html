<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="container">
      <h3>NYONDOSTOCK</h3>
          <!-- <h5>HARDWARE</h5> -->
      <div class="card">
        <div class="card-header text-center">
          <h5>WELCOME</h5>
          <h6>LOGIN INTO YOUR ACCOUNT</h6>
        </div>
        <div class="card-body">
          <form>
            <div class="mb-3">
              <label for="exampleInputPassword1" class="form-label"
                >User-role</label
              >
              <input
                type="text"
                class="form-control"
                id="exampleInputuser_role"
              />
            </div>
            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label"
                >Email address</label
              >
              <input
                type="email"
                class="form-control"
                id="exampleInputEmail1"
                aria-describedby="emailHelp"
              />
              <div id="emailHelp" class="form-text">
                We'll never share your email with anyone else.
              </div>
            </div>
            <div class="mb-3">
              <label for="exampleInputPassword1" class="form-label"
                >Password</label
              >
              <input
                type="password"
                class="form-control"
                id-unique="exampleInputPassword1"
              />
              <p>forgot password?</p>
            </div>
            <div class="button ">
              <button type="submit" class="btn btn-primary"> login</button>
             
            </div>
            <!-- <p>Don't have an account? click the signup button</p>
            <div class="button text-white">
               <button type="submit" class="btn text-bg-primary"> <a href="./signup.html" target="_blank" style="color: white;">sign up</a></button>
            </div> -->
          </form>
        </div>
        <div class="card-footer text-body-secondary">
          &#169;Nyondostock hardware 2026
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
