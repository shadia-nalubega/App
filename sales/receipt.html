<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./receipt.css">
  </head>
  <body>
    <div class="card">
      <div class="header">
        <h3>NYONDOSTOCK</h3>
        <h4>Receipt</h4>
      </div>
      <div class="detail">
      <p>ReceiptNo:</p>
      <p>Date:</p>
      <p>Time:</p>
      <p>Cashier:</p>
      </div>
      <table class="table table-striped table-hover table-bordered border-secondary mt-3">
        <tr>
          <th>Item</th>
          <th>Qty</th>
          <th>unitPrice</th>
          <th>Amount</th>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
      </table>
      <div class="total">
        <p>Subtotal:</p>
        <p>Tax:</p>
      </div>
      <p><b></b>Grandtotal:</p>
      <div class="button mt-4">
        <button type="button" class="btn btn-secondary btn-md mt-3">
          Print
        </button>
        <button type="button" class="btn btn-secondary btn-md mt-3">
          Exit
        </button>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
