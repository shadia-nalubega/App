<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://kit.fontawesome.com/a9325a5910.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./receipt.css" />
  </head>
  <body>
    <div class="card">
      <div class="header">
        <h3>NYONDOSTOCK</h3>
        <h4>
          TEMPORARY RECEIPT
          <button style="float: right;">NOT FINAL</button>
        </h4>
      </div>
      <div class="detail">
        <table>
          <tr>
            <td>ReceiptNo:</td>
            <td></td>
          </tr>
          <tr>
            <td>Date:</td>
            <td></td>
          </tr>
          <tr>
            <td>Time:</td>
            <td></td>
          </tr>
          <tr>
            <td>Cashier:</td>
            <td></td>
          </tr>
        </table>
        <div class="card1 " style="float: right;">
          <div class="card-body">
            <h5 class="card-title">PENDING COMPLETION</h5>
          </div>
        </div>
      </div>

      <div class="tab2">
        <h5>DEPOSIT DETAILS</h5>
        <table>
          <tr>
            <td>Customer Name:</td>
            <td></td>
          </tr>
          <tr>
            <td>Phone:</td>
            <td></td>
          </tr>
          <tr>
            <td>Deposit Amount:</td>
            <td></td>
          </tr>
          <tr>
            <td>Received by:</td>
            <td></td>
          </tr>
        </table>
      </div>

      <div class="footer mt-5">
        <div class="alert alert-primary d-flex align-items-center" role="alert">
         <i class="fa-solid fa-triangle-exclamation"></i>
          <div>This is a temporary receipt for your deposit.<br>
            Please keep it safe and present it when completing your purchase.
                
          </div>
        </div>
      </div>
      <div class="button mt-4">
        <button type="button" class="btn btn-secondary btn-md mt-3">
          Print
        </button>
        <button type="button" class="btn btn-secondary btn-md mt-3">
          Exit
        </button>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
